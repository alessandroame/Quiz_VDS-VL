<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VDS-VL Quiz Master</title>
    <meta name="description" content="Simulatore esame e studio quiz VDS-VL Volo Libero AeCI" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VDS Quiz" />
    <!-- Google Identity Services per Google Drive Cloud Backup -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        z-index: 99999;
      }
      .splash-pulse {
        animation: splashPulse 1.8s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.88; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .splash-icon-img {
        width: min(240px, 62vw);
        height: min(240px, 62vw);
        min-width: 160px;
        min-height: 160px;
        max-width: 280px;
        max-height: 280px;
        border-radius: 54px;
        box-shadow: 0 20px 45px rgba(245, 158, 11, 0.35), 0 0 35px rgba(245, 158, 11, 0.2);
        object-fit: cover;
        display: block;
      }
      .splash-title {
        font-size: clamp(22px, 5.5vw, 32px);
        font-weight: 800;
        letter-spacing: 0.05em;
        color: #f4f4f5;
        text-transform: uppercase;
        margin-top: 24px;
        text-align: center;
      }
      .splash-sub {
        font-size: clamp(11px, 2.8vw, 13px);
        font-weight: 600;
        color: #a1a1aa;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-top: 6px;
        text-align: center;
      }
      .splash-bar {
        width: min(180px, 48vw);
        height: 3.5px;
        background: #27272a;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-top: 24px;
      }
      .splash-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40%;
        width: 60%;
        background: linear-gradient(90deg, transparent, #f59e0b, #fbbf24, transparent);
        border-radius: 999px;
        animation: splashSweep 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splashSweep {
        0% { left: -60%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 light:bg-slate-50 light:text-slate-900 antialiased selection:bg-amber-500 selection:text-black transition-colors">
    <div id="root">
      <!-- Zero-Latency First-Paint Cockpit Splash Screen (0ms FCP, auto-replaced on React mount) -->
      <div id="splash-screen">
        <div class="splash-pulse" style="display:flex; flex-direction:column; align-items:center;">
          <img
            src="/icons/icon-512x512.png"
            alt="VDS-VL Quiz Master Icon"
            class="splash-icon-img"
          />
          <div class="splash-title">
            VDS-VL <span style="color: #f59e0b;">Quiz Master</span>
          </div>
          <div class="splash-sub">
            Volo Libero • AeCI
          </div>
        </div>
        <div class="splash-bar">
          <div class="splash-bar-fill"></div>
        </div>
        <div style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; color: #71717a; letter-spacing: 0.22em; margin-top: 12px; text-transform: uppercase;">
          Avionics Ready
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
