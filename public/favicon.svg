<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Carbon Zinc (Zero Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Glowing Aviation Amber Gradient -->
    <linearGradient id="amberPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Delta Body Shading -->
    <linearGradient id="deltaBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Subtle Avionics Instrument Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Precision Cockpit Bezel -->
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="#27272a" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="92" stroke="#18181b" stroke-width="2"/>

  <!-- Instrument Tick Marks at Cardinal Points -->
  <line x1="256" y1="28" x2="256" y2="44" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="468" x2="256" y2="484" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="256" x2="44" y2="256" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="468" y1="256" x2="484" y2="256" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- PARAGLIDER CANOPY (Arco Calotta Parapendio) -->
  <path d="M 96 192 C 144 82, 368 82, 416 192 C 360 150, 152 150, 96 192 Z"
        fill="url(#amberPrimary)" filter="url(#amberGlow)"/>

  <!-- Cell Ribs (Centine cassoni) -->
  <path d="M 168 144 Q 182 162 192 172" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 256 124 L 256 166" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 344 144 Q 330 162 320 172" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

  <!-- Suspension Lines (Fasci Funicelle coniche al baricentro) -->
  <line x1="112" y1="188" x2="256" y2="272" stroke="#f59e0b" stroke-width="3.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="186" y1="172" x2="256" y2="272" stroke="#f59e0b" stroke-width="3.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="326" y1="172" x2="256" y2="272" stroke="#f59e0b" stroke-width="3.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="400" y1="188" x2="256" y2="272" stroke="#f59e0b" stroke-width="3.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- DELTAPLANO WING (Ala a Delta / Shield V) -->
  <polygon points="256,220 424,304 256,424 88,304"
           fill="url(#deltaBody)"
           stroke="url(#amberPrimary)"
           stroke-width="12"
           stroke-linejoin="round"
           filter="url(#amberGlow)"/>

  <!-- Keel Tube (Tubo di Chiglia centrale) -->
  <line x1="256" y1="220" x2="256" y2="424" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>

  <!-- Crossbar Struts (Traversa strutturale) -->
  <line x1="172" y1="364" x2="256" y2="304" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="364" x2="256" y2="304" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Control Frame Trapezoid (Trapezio di pilotaggio deltaplano) -->
  <polygon points="256,280 298,348 214,348" fill="none" stroke="#fef08a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Center Instrument Pivot / Flight Attitude Dot -->
  <circle cx="256" cy="304" r="8" fill="#fef08a" filter="url(#amberGlow)"/>
</svg>
